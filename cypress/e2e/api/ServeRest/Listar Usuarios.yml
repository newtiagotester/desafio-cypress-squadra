info:
  name: Listar Usuarios
  type: http
  seq: 1

http:
  method: GET
  url: https://serverest.dev/usuarios?nome=Tiago
  headers:
    - name: accept
      value: application/json
  params:
    - name: nome
      value: Tiago
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
